<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Space Grotesk, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161320"/><stop offset="1" stop-color="#09090c"/></linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.55"><stop offset="0" stop-color="#FF6B50" stop-opacity="0.16"/><stop offset="1" stop-color="#FF6B50" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- login card -->
  <rect x="100" y="100" width="440" height="520" rx="28" fill="#131217" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(320 185)">
    <rect x="-34" y="-8" width="68" height="56" rx="10" fill="#c5a059"/>
    <path d="M-20 -8 V-24 A20 20 0 0 1 20 -24 V-8" fill="none" stroke="#c5a059" stroke-width="8"/>
    <circle cx="0" cy="18" r="7" fill="#131217"/>
  </g>
  <text x="320" y="290" fill="#ffffff" font-size="30" font-weight="500" text-anchor="middle">Welcome back</text>
  <rect x="145" y="325" width="350" height="54" rx="12" fill="#0b0b0e" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="168" y="359" fill="#999999" font-size="18">hamza@example.com</text>
  <rect x="145" y="395" width="350" height="54" rx="12" fill="#0b0b0e" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="168" y="430" fill="#999999" font-size="22" letter-spacing="6">••••••••••</text>
  <rect x="145" y="475" width="350" height="58" rx="12" fill="#FF6B50"/>
  <text x="320" y="511" fill="#000000" font-size="17" font-weight="700" letter-spacing="4" text-anchor="middle">SIGN IN</text>
  <text x="320" y="575" fill="#777777" font-size="15" text-anchor="middle">Forgot password? · Create account</text>
  <!-- API panel -->
  <rect x="610" y="100" width="570" height="520" rx="28" fill="#0d0c11" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="650" cy="140" r="7" fill="#FF6B50"/><circle cx="675" cy="140" r="7" fill="#c5a059"/><circle cx="700" cy="140" r="7" fill="#555"/>
  <text x="1140" y="146" fill="#666" font-size="14" letter-spacing="3" text-anchor="end">AUTH API</text>
  <g font-family="Consolas, monospace" font-size="19">
    <rect x="650" y="180" width="76" height="30" rx="6" fill="#c5a059" fill-opacity="0.15"/><text x="688" y="201" fill="#c5a059" text-anchor="middle" font-weight="700">POST</text>
    <text x="745" y="201" fill="#EBEBEB">/api/auth/register</text>
    <rect x="650" y="228" width="76" height="30" rx="6" fill="#c5a059" fill-opacity="0.15"/><text x="688" y="249" fill="#c5a059" text-anchor="middle" font-weight="700">POST</text>
    <text x="745" y="249" fill="#EBEBEB">/api/auth/login</text>
    <rect x="650" y="276" width="76" height="30" rx="6" fill="#FF6B50" fill-opacity="0.15"/><text x="688" y="297" fill="#FF6B50" text-anchor="middle" font-weight="700">GET</text>
    <text x="745" y="297" fill="#EBEBEB">/api/auth/me</text>
    <rect x="650" y="324" width="76" height="30" rx="6" fill="#c5a059" fill-opacity="0.15"/><text x="688" y="345" fill="#c5a059" text-anchor="middle" font-weight="700">POST</text>
    <text x="745" y="345" fill="#EBEBEB">/api/auth/logout</text>
    <line x1="650" y1="385" x2="1140" y2="385" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="650" y="425" fill="#888">{</text>
    <text x="675" y="458" fill="#e8d0a3">"status"<tspan fill="#888">: </tspan><tspan fill="#c5a059">200</tspan><tspan fill="#888">,</tspan></text>
    <text x="675" y="491" fill="#e8d0a3">"user"<tspan fill="#888">: </tspan><tspan fill="#EBEBEB">"hamza"</tspan><tspan fill="#888">,</tspan></text>
    <text x="675" y="524" fill="#e8d0a3">"token"<tspan fill="#888">: </tspan><tspan fill="#FF6B50">"eyJhbGciOiJIUzI1..."</tspan></text>
    <text x="650" y="557" fill="#888">}</text>
  </g>
  <text x="1140" y="592" fill="#c5a059" font-size="14" letter-spacing="3" text-anchor="end" font-weight="600">JWT · BCRYPT · SESSIONS</text>
</svg>
