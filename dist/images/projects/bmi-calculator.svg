    <radialGradient id="glow" cx="0.75" cy="0.35" r="0.6"><stop offset="0" stop-color="#c5a059" stop-opacity="0.22"/><stop offset="1" stop-color="#c5a059" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
